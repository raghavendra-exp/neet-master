name: Official Portal Health & Link Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Run weekly on Mondays at 06:00 UTC
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Official Link Check
        run: node scripts/link-checker.js
